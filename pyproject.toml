[project]
name = "project_management"
version = "0.3.0"
description = "project-management using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.23,<2.0.0",
]

[project.scripts]
kickoff = "project_management.main:kickoff"
run_crew = "project_management.main:kickoff"
plot = "project_management.main:plot"
run_with_trigger = "project_management.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "fcd52e51-f762-4035-8660-1aacf7c59c09"
